{% extends "public.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth"><div class="card auth-card">
  <div class="badge-top">🔑</div>
  <h1>Welcome back</h1><p class="sub">Log in to your library account</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autofocus required></div>
    <div class="field"><label for="password">Password</label>
      <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle-pw>Show</button></div></div>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="auth-foot">New here? <a href="{{ url_for('register') }}">Create a member account</a></p>
</div></div>
{% endblock %}
